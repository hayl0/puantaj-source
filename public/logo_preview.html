<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puantaj Pro - Logo Final Adayları</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            background-image: radial-gradient(circle at 50% 0%, #1a0b00 0%, #000000 90%); /* Subtle Orange/Dark bg */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            background: linear-gradient(90deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 36px;
            letter-spacing: -0.5px;
            text-align: center;
        }
        p {
            color: #86868b;
            margin-bottom: 50px;
            font-size: 18px;
            font-weight: 400;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 50px;
            max-width: 1000px;
            width: 100%;
            justify-items: center;
        }
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .app-item:hover {
            transform: translateY(-5px);
        }
        .app-icon {
            width: 180px;
            height: 180px;
            border-radius: 42px; /* iOS Continuous Curvature (Squircle approximation) */
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            overflow: hidden; /* Important for squircle clipping */
            position: relative;
        }
        .app-icon svg {
            width: 100%;
            height: 100%;
        }
        .app-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-top: 10px;
        }
        .variant-label {
            font-size: 13px;
            color: #6e6e73;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>Puantaj Pro - İstatistik & Site Renkleri</h1>
    <p>Web sitesinin orijinal renk paleti (Indigo/Violet) ve istatistik sembolleriyle harmanlanmış "Gold Contrast" stilinde tasarımlar.</p>

    <div class="grid">
        
        <!-- 1. Bar Chart Integration -->
        <div class="app-item">
            <div class="app-icon">
                <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="1024" height="1024" fill="#030712" />
                    
                    <!-- Symbol: Rising Bars -->
                    <g transform="translate(512, 380)">
                        <rect x="-100" y="20" width="50" height="100" rx="8" fill="#334155" />
                        <rect x="-30" y="-40" width="50" height="160" rx="8" fill="#475569" />
                        <rect x="40" y="-100" width="50" height="220" rx="8" fill="#6366f1" />
                    </g>
                    
                    <!-- Text -->
                    <text x="512" y="650" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="140" fill="#f8fafc" letter-spacing="-1">Puantaj<tspan fill="#6366f1">Pro</tspan></text>
                </svg>
            </div>
            <div class="app-name">Puantaj Pro</div>
            <div class="variant-label">Sütun Grafik (Bar)</div>
        </div>

        <!-- 2. Line Graph Pulse -->
        <div class="app-item">
            <div class="app-icon">
                <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="1024" height="1024" fill="#030712" />
                    
                    <!-- Symbol: Line Graph -->
                    <path d="M 300 450 L 450 350 L 550 420 L 724 250" stroke="url(#lineGrad)" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    <circle cx="300" cy="450" r="15" fill="#334155" />
                    <circle cx="450" cy="350" r="15" fill="#334155" />
                    <circle cx="550" cy="420" r="15" fill="#334155" />
                    <circle cx="724" cy="250" r="25" fill="#6366f1" />
                    
                    <!-- Text -->
                    <text x="512" y="650" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="140" fill="#f8fafc" letter-spacing="-1">Puantaj<tspan fill="#6366f1">Pro</tspan></text>
                </svg>
            </div>
            <div class="app-name">Puantaj Pro</div>
            <div class="variant-label">Çizgi Grafik (Line)</div>
        </div>

        <!-- 3. Analytics Nodes -->
        <div class="app-item">
            <div class="app-icon">
                <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="1024" height="1024" fill="#030712" />
                    
                    <!-- Symbol: Connected Nodes -->
                    <g transform="translate(512, 350)">
                        <circle cx="0" cy="-80" r="30" fill="#6366f1" />
                        <circle cx="-100" cy="50" r="20" fill="#334155" />
                        <circle cx="100" cy="50" r="20" fill="#334155" />
                        
                        <path d="M 0 -80 L -100 50 M 0 -80 L 100 50 M -100 50 L 100 50" stroke="#475569" stroke-width="8" />
                    </g>
                    
                    <!-- Text -->
                    <text x="512" y="650" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="140" fill="#f8fafc" letter-spacing="-1">Puantaj<tspan fill="#6366f1">Pro</tspan></text>
                </svg>
            </div>
            <div class="app-name">Puantaj Pro</div>
            <div class="variant-label">Veri Ağı (Nodes)</div>
        </div>

        <!-- 4. Donut Pie Chart -->
        <div class="app-item">
            <div class="app-icon">
                <svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="1024" height="1024" fill="#030712" />
                    
                    <!-- Symbol: Donut Chart -->
                    <path d="M 512 250 A 130 130 0 1 1 382 380" stroke="#334155" stroke-width="40" stroke-linecap="round" fill="none" />
                    <path d="M 512 250 A 130 130 0 0 1 642 380" stroke="#6366f1" stroke-width="40" stroke-linecap="round" fill="none" />
                    
                    <!-- Text -->
                    <text x="512" y="650" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="140" fill="#f8fafc" letter-spacing="-1">Puantaj<tspan fill="#6366f1">Pro</tspan></text>
                </svg>
            </div>
            <div class="app-name">Puantaj Pro</div>
            <div class="variant-label">Halka Grafik (Donut)</div>
        </div>

    </div>

</body>
</html>
